name: Fresh Quartz 5 setup
on:
  push:
    branches: [main]
    paths: [.github/workflows/fresh-setup.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
        with:
          path: site
          ref: main
      - uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: 97a2d05f80c4c50534959b1d0d41cc4b3895625e
          path: quartz-upstream
          persist-credentials: false
      - name: Create fresh site from official Quartz and vault content
        run: |
          python3 - ../quartz-upstream <<'PYSETUP'
          from pathlib import Path
          import hashlib,json
          expected=json.loads('{"Daily-Notes/Linear-Decoding-and-Deep-Nets-with-Neural-Collapse.md": "17b08755a390b5a73e8f5614f1c274743b2bde4c5dc1b68c89bebf9626265ee2", "Daily-Notes/Masked-Language-Modeling.md": "9aa7930d27d7e4299bc38860c680c5139464278c301d9c6582df11f8b3e18bba", "Daily-Notes/Mech-Interp,-Variables,-Interpretable-Bases.md": "511f2c40530998332310730b025a1f62b8cb5e3fcf0b557ce8c0787acc790213", "Daily-Notes/Some-definitions-in-Information-Theory.md": "7d9fb09f56aa8cf41012c4f62cf4b6439c0514f2721be44d285922ca5f86d48d", "Daily-Notes/Toy-Models-of-Superposition.md": "1c1d913519324d66b7ce0edc319c1f2738d4e80ec72ff39ebf0957f0c94afc4a", "Daily-Notes/index.md": "3ffcc53ca2953bd160bded1e1cc44ff4162c300206ffded3b81700bf25cd2eb3", "Paper-Reading/How-Does-IB-help-DL.md": "e4962846bbd472d7b35ea1918e195148727816e7458629dcbd801e1cc971712b", "Paper-Reading/LLMs-Struggle-to-Learn-Long-Tail-Knowledge.md": "e95dc5f27e5023cee628ade68d5c6ad47ea54655c25e086f980f76186d29de3f", "Paper-Reading/Language-Models-for-Text-Classification---Is-ICL-Enough.md": "7aed4e63519496de0f5d32c2bfb5b16e05d55fc0834e1bc7e41f41009ca81088", "Paper-Reading/index.md": "2c4fddbb698c55060bba3888cf9eb52ecdd3eb7febf14161d53a1da49a7cf411", "assets/pfp_170.png": "e361c90eea8b156c55b561d7fd8c472ab8730552c59ebabeb33cb3305e01da19", "assets/pfp_200.png": "75b29b08a4bc8a57a2ec1aa4ba7b81850d4fe0c99159de60112b8a6058d245a7", "assets/pfp_256.png": "70364bcd13a498f1d61fa0b13e0ac57bb8124257b4e7828e59c45d75bc642808", "images/entitylinkinglongtail.png": "54f7f3107baa86adf0abb118d4cd98e32a0b64a8ed80576f72b58571b03373e0", "index.md": "fdf572f0c9ba3006341e6cb48df1e8e260c9924ee2df1cb69ae5a5a39c24f37d"}')
          for name,digest in expected.items():
              assert hashlib.sha256((Path('content')/name).read_bytes()).hexdigest()==digest, 'Content changed: '+name
          from pathlib import Path
          import hashlib
          import json
          import re
          import shutil
          import sys
          import tempfile

          root = Path.cwd()
          upstream = Path(sys.argv[1]).resolve()
          vault = Path(sys.argv[2]).resolve() if len(sys.argv) > 2 else root / 'content'
          assert (upstream / 'package.json').is_file()
          assert json.loads((upstream / 'package.json').read_text())['version'].startswith('5.')
          assert (vault / 'index.md').is_file()

          def normalize(text):
              front, body = text.removeprefix('---\n').split('\n---\n', 1)
              front = re.sub(r'^aliases:\n(?:  - .*\n?)+', '', front, flags=re.M)
              front = re.sub(r'^tags: \[\]\n?', '', front, flags=re.M)
              # Quartz supplies the page's H1 from title; article sections begin at H2.
              body = re.sub(r'^(#{1,5}) ', r'\1# ', body, flags=re.M)
              return '---\n' + front.rstrip() + '\n---\n\n' + body.lstrip('\n')

          with tempfile.TemporaryDirectory() as tmp:
              saved = Path(tmp) / 'content'
              shutil.copytree(vault, saved, ignore=shutil.ignore_patterns('.obsidian', '.git', '.DS_Store', 'node_modules'))
              for note in saved.rglob('*.md'):
                  note.write_text(normalize(note.read_text()))
              for entry in root.iterdir():
                  if entry.name in {'.git', '.github'}:
                      continue
                  if entry.is_dir():
                      shutil.rmtree(entry)
                  else:
                      entry.unlink()
              for entry in upstream.iterdir():
                  if entry.name in {'.git', '.github', 'content', 'node_modules'}:
                      continue
                  target = root / entry.name
                  if entry.is_dir():
                      shutil.copytree(entry, target)
                  else:
                      shutil.copy2(entry, target)
              shutil.copytree(saved, root / 'content')

          config = (upstream / 'quartz/cli/templates/default.yaml').read_text()
          config = config.replace('$schema=../../plugins/', '$schema=./quartz/plugins/')
          config = config.replace('pageTitle: Quartz 5', 'pageTitle: Akash Sharma')
          config = config.replace('analytics:\n    provider: plausible', 'analytics: null')
          config = config.replace('baseUrl: quartz.jzhao.xyz', 'baseUrl: akashrma.github.io')
          config = config.replace('defaultDateType: modified', 'defaultDateType: created')
          config = config.replace('hidePropertiesView: false', 'hidePropertiesView: true')
          config = config.replace('source: "@quartz-community/tag-list"\n    enabled: false', 'source: "@quartz-community/tag-list"\n    enabled: true')
          config = config.replace('GitHub: https://github.com/jackyzha0/quartz\n        Discord Community: https://discord.gg/cRFFHYye7t', 'GitHub: https://github.com/akashrma\n        Twitter: https://twitter.com/mathcrush247\n        LinkedIn: https://www.linkedin.com/in/akashsharma7243/')
          (root / 'quartz.config.yaml').write_text(config)
          (root / 'quartz/bootstrap-cli.mjs').chmod(0o755)

          scripts = root / 'scripts'
          scripts.mkdir()
          (scripts / 'sync-vault.mjs').write_text('''import { cp, mkdir, readdir, rename, rm, stat } from "node:fs/promises"
          import { basename, dirname, join, resolve } from "node:path"
          import { fileURLToPath } from "node:url"

          const root = resolve(dirname(fileURLToPath(import.meta.url)), "..")
          const source = resolve(process.argv[2] ?? join(root, "..", "blog"))
          const content = join(root, "content")
          const staging = join(root, ".quartz-cache", "vault-sync")
          const ignored = new Set([".obsidian", ".git", ".DS_Store", "node_modules"])
          if (source === root || source === content || source.startsWith(`${content}/`)) {
            throw new Error("Choose the Obsidian vault outside this repository.")
          }
          if (!(await stat(join(source, "index.md"))).isFile()) {
            throw new Error(`Vault homepage missing: ${source}/index.md`)
          }
          await rm(staging, { recursive: true, force: true })
          await mkdir(staging, { recursive: true })
          for (const name of await readdir(source)) {
            if (!ignored.has(name)) {
              await cp(join(source, name), join(staging, name), {
                recursive: true,
                filter: path => !ignored.has(basename(path)),
              })
            }
          }
          await rm(content, { recursive: true, force: true })
          await rename(staging, content)
          console.log(`Synced vault: ${source}`)
          ''')
          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          package['scripts'].update({'sync-vault': 'node scripts/sync-vault.mjs', 'build': 'quartz build', 'preview': 'quartz build --serve'})
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          (root / 'README.md').write_text('''# Akash Sharma's notes

          Fresh Quartz 5 setup with content from the Obsidian vault at `../blog`.
          The website is https://akashrma.github.io/.

          ## Setup

          Use Node.js 24 and npm 10.9.2 or newer.

          ```sh
          npm ci
          npx quartz plugin install --from-config
          ```

          ## Edit and publish

          Edit notes in the `blog` vault. The homepage is `index.md`.
          Use YAML frontmatter for `title`, `date` (YYYY-MM-DD), and optional `tags`.
          Aliases are optional alternate names, not copies of titles. Article headings
          start at H2 because Quartz renders the page title as H1.
          Wikilinks, callouts and LaTeX are supported.

          ```sh
          git switch main
          git pull --ff-only origin main
          npm run sync-vault
          npm run preview
          # After reviewing the preview:
          git add content
          git commit -m "Update notes"
          git push origin main
          ```

          GitHub Actions builds and deploys pushes to `main`. Obsidian settings are excluded
          from the published content. `quartz.config.yaml` starts from Quartz's default
          v5 template; the Properties panel is hidden and tags remain visible as links.

          Quartz documentation: https://quartz.jzhao.xyz/
          ''')
          print('Fresh Quartz 5 setup complete:', len(list((root / 'content').rglob('*.md'))), 'notes')
          PYSETUP
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx quartz plugin install --from-config
      - run: npx quartz build
      - name: Verify published pages
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          pages=list(Path('public').rglob('*.html'))
          assert Path('public/index.html').is_file()
          assert len(list(Path('content').rglob('*.md')))==11
          assert not any('class="note-properties' in page.read_text() for page in pages), 'Properties panel still rendered'
          print('Built', len(pages), 'pages without Properties panels')
          PYCHECK
      - name: Commit fresh source and content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code -- .github
          git commit -m 'Rebuild fresh Quartz 5 site from normalized Obsidian vault'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
